[package]
name = "syntrail_lm"
version = "0.4.0"
edition = "2024"

[features]
default = []
gui = ["dep:eframe", "dep:rfd"]

[[bin]]
name = "syntrail"
path = "src/main.rs"

[[bin]]
name = "syntrail-gui"
path = "src/bin/syntrail_gui.rs"
required-features = ["gui"]

[[bin]]
name = "syntrail-trainer"
path = "src/bin/syntrail_trainer.rs"
required-features = ["gui"]

[lib]
name = "syntrail_lm"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
encoding_rs = "0.8"
eframe = { version = "0.29", optional = true }
rfd   = { version = "0.15", optional = true }

[dev-dependencies]
tempfile = "3"

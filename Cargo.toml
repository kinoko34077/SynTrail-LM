[package]
name = "syntrail_lm"
version = "0.4.0"
edition = "2024"

[features]
default = []
gui = ["dep:eframe"]

[[bin]]
name = "syntrail"
path = "src/main.rs"

[[bin]]
name = "syntrail-gui"
path = "src/bin/syntrail_gui.rs"
required-features = ["gui"]

[lib]
name = "syntrail_lm"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
eframe = { version = "0.29", optional = true }

[dev-dependencies]
tempfile = "3"

[package]
name = "syntrail_lm"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "syntrail"
path = "src/main.rs"

[lib]
name = "syntrail_lm"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
